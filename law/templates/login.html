{% extends "base.html" %}
{% load static %}

{% block title %}Civic Companion - Sign In{% endblock %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center py-5" style="min-height: calc(100vh - 200px);">
  <div class="col-12 col-md-8 col-lg-5">
    <div class="card-premium p-4 p-md-5 border-0 shadow-lg bg-white">
      <div class="text-center mb-4">
        <img src="{% static 'images/logo.png' %}" alt="Logo" width="60" height="60" class="rounded shadow-sm mb-3">
        <h2 class="fw-bold text-dark m-0">Welcome Back</h2>
        <p class="text-muted small">Sign in to your premium LegalTech account</p>
      </div>

      {% if error_msg %}
        <div class="alert alert-danger border-0 rounded-3 shadow-sm d-flex align-items-center gap-2 mb-4" role="alert">
          <i class="bi bi-exclamation-triangle-fill"></i>
          <div>{{ error_msg }}</div>
        </div>
      {% endif %}

      <form method="POST">
        {% csrf_token %}
        
        <div class="mb-3">
          <label for="id_username" class="form-label fw-medium text-dark">Username</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-0"><i class="bi bi-person text-muted"></i></span>
            <input type="text" name="username" autofocus maxlength="150" required id="id_username" class="form-control bg-light border-0 py-2.5 shadow-none" placeholder="Enter your username">
          </div>
        </div>

        <div class="mb-4">
          <label for="id_password" class="form-label fw-medium text-dark">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-0"><i class="bi bi-shield-lock text-muted"></i></span>
            <input type="password" name="password" required id="id_password" class="form-control bg-light border-0 py-2.5 shadow-none" placeholder="Enter your password">
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2.5 rounded-pill shadow-sm fw-medium transition-transform hover-scale">
          Sign In
        </button>
      </form>

      <div class="text-center mt-4 pt-3 border-top">
        <p class="text-muted small mb-0">Don't have an account? <a href="{% url 'register' %}" class="text-primary fw-bold text-decoration-none">Sign Up</a></p>
      </div>
    </div>
  </div>
</div>

<style>
  .py-2\.5 {
    padding-top: 0.65rem !important;
    padding-bottom: 0.65rem !important;
  }
  .input-group-text {
    border-radius: 8px 0 0 8px !important;
  }
  .form-control {
    border-radius: 0 8px 8px 0 !important;
  }
  .hover-scale:hover {
    transform: scale(1.02);
  }
  .transition-transform {
    transition: transform 0.2s ease-in-out;
  }
</style>
{% endblock %}
